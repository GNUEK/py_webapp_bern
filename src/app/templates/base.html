<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block titel %}Velo-Wartungslogbuch{% endblock %}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
    <nav class="navbar navbar-expand bg-dark navbar-dark mb-4">
        <div class="container">
            <a class="navbar-brand fw-semibold" href="{{ url_for('velos.uebersicht') }}">🚲 Velo-Wartungslogbuch</a>
            {% if session.angemeldet %}
            <div class="navbar-nav align-items-center">
                <a class="nav-link" href="{{ url_for('velos.uebersicht') }}">Übersicht</a>
                <a class="nav-link" href="{{ url_for('velos.velo_neu') }}">Velo erfassen</a>
                <a class="nav-link" href="{{ url_for('strava.strava_seite') }}">Strava</a>
                <form method="post" action="{{ url_for('auth.logout') }}">
                    <button class="btn btn-link nav-link" type="submit">Abmelden</button>
                </form>
            </div>
            {% endif %}
        </div>
    </nav>

    <main class="container pb-5">
        {% with meldungen = get_flashed_messages(with_categories=true) %}
        {% for kategorie, meldung in meldungen %}
        <div class="alert alert-{{ kategorie }}" role="alert">{{ meldung }}</div>
        {% endfor %}
        {% endwith %}

        {% block inhalt %}{% endblock %}
    </main>
</body>

</html>
