{% extends "base.html" %}
{% block titel %}Anmelden – Velo-Wartungslogbuch{% endblock %}

{% block inhalt %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-4">
        <h1 class="h3 mb-4">Anmelden</h1>
        <form method="post" action="{{ url_for('auth.login') }}">
            <input type="hidden" name="next" value="{{ ziel }}">
            <div class="mb-3">
                <label class="form-label" for="passwort">Passwort</label>
                <input class="form-control" id="passwort" name="passwort" type="password"
                    autocomplete="current-password" required autofocus>
            </div>
            <button class="btn btn-primary" type="submit">Anmelden</button>
        </form>
    </div>
</div>
{% endblock %}
